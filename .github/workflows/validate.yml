name: Validate Chispa
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check migration.js
          node --check sw.js
      - name: Check required PWA files
        run: |
          test -s index.html
          test -s styles.css
          test -s manifest.webmanifest
          test -s icon.svg
          python -m json.tool manifest.webmanifest >/dev/null