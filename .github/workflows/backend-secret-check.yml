name: Backend secret availability
on:
  pull_request:
    paths:
      - '.github/workflows/backend-secret-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && echo "SUPABASE_SERVICE_ROLE_KEY=yes" || echo "SUPABASE_SERVICE_ROLE_KEY=no"
          [ -n "$SUPABASE_SERVICE_KEY" ] && echo "SUPABASE_SERVICE_KEY=yes" || echo "SUPABASE_SERVICE_KEY=no"
          [ -n "$DATABASE_URL" ] && echo "DATABASE_URL=yes" || echo "DATABASE_URL=no"
          [ -n "$SUPABASE_URL" ] && echo "SUPABASE_URL=yes" || echo "SUPABASE_URL=no"
          [ -n "$SUPABASE_ANON_KEY" ] && echo "SUPABASE_ANON_KEY=yes" || echo "SUPABASE_ANON_KEY=no"
